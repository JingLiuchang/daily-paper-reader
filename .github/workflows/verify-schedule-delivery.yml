name: Verify schedule delivery (no models)

on:
  schedule:
    # Temporary control: November 13, Beijing 12:17–13:57. Remove after verification.
    - cron: "17,37,57 4-5 13 11 *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the scheduled event without accessing models or repository contents
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          test "$TRIGGER_EVENT" = schedule
          {
            echo 'Independent schedule control (no model calls)'
            echo "Event: $TRIGGER_EVENT"
            echo "Schedule: $TRIGGER_SCHEDULE"
            echo "Actor: $TRIGGER_ACTOR"
            echo "Commit: $GITHUB_SHA"
            date -u '+Runner started: %Y-%m-%dT%H:%M:%SZ'
          } | tee -a "$GITHUB_STEP_SUMMARY"
