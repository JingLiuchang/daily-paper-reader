name: Reconcile daily paper versions (offline)
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: daily-paper-reader
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Reconcile indexes without model calls
        run: python scripts/reconcile_daily_versions.py
      - name: Publish indexes and verify Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m '[chore] consolidate daily paper versions' -m 'Co-Authored-By: xixi <3495302215@qq.com>'
            git push
          fi
          python scripts/request_pages_build.py
